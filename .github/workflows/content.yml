name : testing Release production workflow
on: push
env:
    GATSBY_CPU_COUNT: 2
    GATSBY_ENV: production
    DIRECTUS_AUTH_TOKEN: ${{ secrets.DIRECTUS_AUTH_TOKEN }}
    GATSBY_ENV_CIO_SITE_ID: ${{ secrets.GATSBY_ENV_CIO_SITE_ID }}
jobs:
    lint:
        timeout-minutes: 10
        runs-on: ubuntu-latest
        environment: production
        
        steps:
           
            - name: Checkout 🛎️
              uses: actions/checkout@v2.3.1
              with:
                ref: p*
        
            - name: Set the value
              id: step_one
              run: |
                   a=`echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"`
                   echo $a
                   git -c 'versionsort.suffix=-' ls-remote --exit-code --refs --tags https://github.com/vijay-deriv/deriv-com
            - name: Use the value
              id: step_two
              run: |
                   echo "$GIT_TAG_NAME"
